    <style>
        body {
            font-family: 'Inter', 'Noto Sans KR', sans-serif;
            background-color: #050a14;
        }
        .network-bg {
            background: radial-gradient(circle at 50% 50%, rgba(10, 30, 60, 1) 0%, rgba(5, 10, 20, 1) 100%);
            position: relative;
            overflow: hidden;
        }
        .network-bg::after {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: radial-gradient(circle, rgba(0, 150, 255, 0.1) 1px, transparent 1px);
            background-size: 40px 40px;
            opacity: 0.3;
        }
        .dot-indicator {
            position: fixed;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 40;
        }
        .dot {
            width: 6px;
            height: 6px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
        }
        .dot.active {
            background: white;
            box-shadow: 0 0 10px white;
        }
    </style>
